<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Times - Liga Mata-Mata</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }
    header {
      background: #020617;
      padding: 20px;
      text-align: center;
    }
    nav {
      background: #1e293b;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #fff;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
    }
    section {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
    }
    .time {
      background: #1e293b;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }
    .time img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Times da Liga</h1>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="times.html">Times</a>
</nav>

<section>
  <div class="time">
    <img src="escudos/real-madrid.png">
    <p>Real Madrid</p>
    <small>Jogador: João</small>
  </div>

  <div class="time">
    <img src="escudos/barcelona.png">
    <p>Barcelona</p>
    <small>Jogador: Pedro</small>
  </div>

  <div class="time">
    <img src="escudos/manchester-city.png">
    <p>Manchester City</p>
    <small>Jogador: Lucas</small>
  </div>

  <div class="time">
    <img src="escudos/psg.png">
    <p>PSG</p>
    <small>Jogador: Carlos</small>
  </div>
</section>

</body>
</html>
